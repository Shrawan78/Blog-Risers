{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Blog Risers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>

  <header class="masthead">
    <div class="masthead__top">
      <a href="{% url 'home' %}" class="masthead__brand">
        <span class="masthead__mark">Blog Risers</span>
        <span class="masthead__tagline">Stories worth staying up for</span>
      </a>
    </div>
  </header>

  <main>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-card__head">
          <h1>Welcome back</h1>
          <p>Log in to write, comment, and pick up where you left off.</p>
        </div>

        <form>
          <div class="form-field">
            <label for="username">Username or email</label>
            <input id="username" type="text" placeholder="you@example.com">
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">
          </div>
          <div class="form-actions">
            <button type="submit" class="button">Log in</button>
          </div>
          <p class="form-hint">New here? <a href="{% url 'register' %}">Create an account</a></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__bottom"><p>&copy; 2026 Blog Risers. Built with care.</p></div>
  </footer>

</body>
</html>
