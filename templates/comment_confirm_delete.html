{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete comment — Blog Risers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>

  {% include 'partials/header.html' %}

  <main>
    <div class="form-page">
      <div class="form-card">
        <h1>Delete this comment?</h1>
        <p class="form-hint">"{{ comment.body|truncatewords:20 }}" — this can't be undone.</p>
        <form method="post">
          {% csrf_token %}
          <div class="form-actions">
            <button type="submit" class="button">Yes, delete it</button>
            <a href="{% url 'post_detail' comment.post.slug %}" class="button button--outline">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  {% include 'partials/footer.html' %}

</body>
</html>
